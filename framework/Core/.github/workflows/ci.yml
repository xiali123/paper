# PaperCrawler::Core - CI/CD Pipeline
# Automated testing, building, and releasing

name: CI/CD

on:
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  CONAN_USER_HOME: ${{ github.workspace }}/conan-home

jobs:
  # ============================================================================
  # Code Quality and Linting
  # ============================================================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format clang-tidy cppcheck

      - name: Run clang-format check
        run: |
          find include examples tests -name "*.hpp" -o -name "*.cpp" | xargs clang-format --dry-run --Werror

      - name: Run clang-tidy
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Debug ..
          run-clang-tidy -p . ../include/*.hpp

      - name: Run cppcheck
        run: |
          cppcheck --enable=all --inconclusive --xml --xml-version=2 --std=c++17 include/ 2> cppcheck-report.xml

  # ============================================================================
  # Build and Test on Multiple Platforms
  # ============================================================================
  build-test:
    name: Build & Test (${{ matrix.os }}, ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    needs: code-quality

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        compiler:
          - gcc
          - clang
          - msvc
        exclude:
          - os: windows-latest
            compiler: gcc
          - os: windows-latest
            compiler: clang
          - os: macos-latest
            compiler: msvc
          - os: ubuntu-latest
            compiler: msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            g++ \
            clang \
            libpthread-dev \
            libspdlog-dev \
            libfmt-dev \
            libgtest-dev \
            libbenchmark-dev \
            ninja-build

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install cmake spdlog fmt googletest google-benchmark ninja

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake ninja spdlog fmt
          # Google Test and Benchmark are bundled with vcpkg

      - name: Configure CMake (Ubuntu/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DBUILD_TESTS=ON \
            -DBUILD_EXAMPLES=ON \
            -DENABLE_BENCHMARKS=ON \
            -DENABLE_COVERAGE=ON \
            -G Ninja

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DBUILD_TESTS=ON `
            -DBUILD_EXAMPLES=ON `
            -DENABLE_BENCHMARKS=ON `
            -G Ninja

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} -j$(nproc)

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure --verbose

      - name: Generate coverage report (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '*/tests/*' '*/include/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v3
        with:
          files: ./build/coverage.info
          flags: unittests
          name: codecov-umbrella

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.compiler }}
          path: build/Testing/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            build/include/
            build/lib/
            build/bin/
            build/*.so
            build/*.a

  # ============================================================================
  # Docker Build
  # ============================================================================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t papercrawler-core:test .

      - name: Run tests in Docker
        run: |
          docker-compose up test

      - name: Build production image
        run: |
          docker build \
            --target runtime \
            -t papercrawler-core:latest \
            .

      - name: Login to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          docker tag papercrawler-core:latest papercrawler/core:${{ github.ref_name }}
          docker push papercrawler/core:${{ github.ref_name }}
          docker push papercrawler/core:latest

  # ============================================================================
  # Documentation Generation
  # ============================================================================
  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Generate documentation
        run: |
          mkdir -p build
          cd build
          cmake -DBUILD_DOCS=ON ..
          cmake --build . --target docs

      - name: Upload documentation
        uses: actions/upload-artifact@v3
        with:
          name: api-documentation
          path: build/docs/html/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/docs/html

  # ============================================================================
  # Release and Package
  # ============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-test, docker-build, docs]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libspdlog-dev libfmt-dev

      - name: Build release
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
                -DBUILD_EXAMPLES=ON \
                -DCMAKE_INSTALL_PREFIX=/usr/local ..
          make -j$(nproc)
          make DESTDIR=../package install

      - name: Create archives
        run: |
          cd package
          tar -czvf papercrawler-core-${{ github.ref_name }}-linux-x64.tar.gz .
          cd ..
          sha256sum package/papercrawler-core-${{ github.ref_name }}-linux-x64.tar.gz > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            package/papercrawler-core-*.tar.gz
            checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================================
  # Performance Benchmarks
  # ============================================================================
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libspdlog-dev libfmt-dev libbenchmark-dev

      - name: Build benchmarks
        run: |
          mkdir -p build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release -DENABLE_BENCHMARKS=ON ..
          cmake --build . --target PaperCrawlerCoreBenchmarks

      - name: Run benchmarks
        working-directory: build
        run: ./PaperCrawlerCoreBenchmarks --benchmark_format=json --benchmark_out=benchmark_results.json

      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: 'googlecpp'
          output-file-path: build/benchmark_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '120%'
          comment-on-alert: true
          fail-on-alert: true
          alert-comment-cc-users: '@maintainers'

  # ============================================================================
  # Security Scanning
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@v2
        with:
          languages: cpp
          queries: security-extended
