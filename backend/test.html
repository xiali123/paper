<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaperCrawler - Test Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #667eea;
            font-size: 36px;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 18px;
        }

        .status {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .status.success {
            border-left: 4px solid #10b981;
        }

        .status.error {
            border-left: 4px solid #ef4444;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .card h2 {
            color: #333;
            font-size: 24px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .results {
            display: none;
        }

        .results.show {
            display: block;
        }

        .paper-item {
            background: #f9fafb;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .paper-item:hover {
            background: #f3f4f6;
            transform: translateX(5px);
        }

        .paper-title {
            font-size: 18px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 10px;
        }

        .paper-meta {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .paper-level {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 10px;
        }

        .level-A {
            background: #fecaca;
            color: #991b1b;
        }

        .level-B {
            background: #fed7aa;
            color: #9a3412;
        }

        .level-C {
            background: #d1d5db;
            color: #374151;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.9;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
            font-size: 18px;
        }

        .hidden {
            display: none;
        }

        .endpoints {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .endpoint {
            background: #f9fafb;
            padding: 15px;
            border-radius: 8px;
            border-left: 3px solid #10b981;
        }

        .endpoint-url {
            font-family: monospace;
            color: #059669;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .endpoint-desc {
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 PaperCrawler API 测试页面</h1>
            <p>Academic Paper Search & Analysis Platform</p>
        </div>

        <div id="status" class="status">
            <strong>状态：</strong> 正在连接服务器...
        </div>

        <div class="card">
            <h2>🔍 搜索论文</h2>
            <div class="search-box">
                <input type="text" id="keyword" placeholder="输入关键词，例如：deep learning, machine learning, computer vision">
                <button onclick="searchPapers()">搜索</button>
            </div>
            <div id="loading" class="loading hidden">搜索中...</div>
            <div id="results" class="results"></div>
        </div>

        <div class="card">
            <h2>📊 统计信息</h2>
            <button onclick="loadStatistics()">加载统计</button>
            <div id="stats" style="margin-top: 20px;"></div>
        </div>

        <div class="card">
            <h2>🔗 API 端点</h2>
            <div class="endpoints">
                <div class="endpoint">
                    <div class="endpoint-url">GET /health</div>
                    <div class="endpoint-desc">健康检查</div>
                </div>
                <div class="endpoint">
                    <div class="endpoint-url">GET /api/search?q=keyword</div>
                    <div class="endpoint-desc">搜索论文</div>
                </div>
                <div class="endpoint">
                    <div class="endpoint-url">GET /api/stats/overview</div>
                    <div class="endpoint-desc">统计信息</div>
                </div>
                <div class="endpoint">
                    <div class="endpoint-url">GET /api/export/csv</div>
                    <div class="endpoint-desc">导出 CSV</div>
                </div>
                <div class="endpoint">
                    <div class="endpoint-url">GET /api/export/json</div>
                    <div class="endpoint-desc">导出 JSON</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080';

        // Check server status
        async function checkStatus() {
            const statusDiv = document.getElementById('status');
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();
                statusDiv.className = 'status success';
                statusDiv.innerHTML = `<strong>✅ 服务器状态：</strong> ${data.service} v${data.version}`;
            } catch (error) {
                statusDiv.className = 'status error';
                statusDiv.innerHTML = `<strong>❌ 服务器状态：</strong> 无法连接到后端服务器<br>请确保后端正在运行（运行 backend/PaperCrawlerServer.exe）`;
            }
        }

        // Search papers
        async function searchPapers() {
            const keyword = document.getElementById('keyword').value.trim();
            if (!keyword) {
                alert('请输入搜索关键词');
                return;
            }

            const loading = document.getElementById('loading');
            const results = document.getElementById('results');

            loading.classList.remove('hidden');
            results.classList.remove('show');
            results.innerHTML = '';

            try {
                const response = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(keyword)}`);
                const data = await response.json();

                loading.classList.add('hidden');
                results.classList.add('show');

                if (data.papers && data.papers.length > 0) {
                    let html = `<h3>搜索结果：找到 ${data.total} 篇论文（显示前 ${data.papers.length} 篇）</h3>`;
                    data.papers.forEach(paper => {
                        html += `
                            <div class="paper-item">
                                <div class="paper-title">${paper.title}</div>
                                <div class="paper-meta">📄 ${paper.journal} | 📅 ${paper.year}</div>
                                <span class="paper-level level-${paper.level}">CCF-${paper.level}</span>
                            </div>
                        `;
                    });
                    results.innerHTML = html;
                } else {
                    results.innerHTML = '<p>未找到相关论文</p>';
                }
            } catch (error) {
                loading.classList.add('hidden');
                results.classList.add('show');
                results.innerHTML = `<p style="color: red;">搜索失败：${error.message}</p>`;
            }
        }

        // Load statistics
        async function loadStatistics() {
            const statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = '<div class="loading">加载中...</div>';

            try {
                const response = await fetch(`${API_BASE}/api/stats/overview`);
                const data = await response.json();

                statsDiv.innerHTML = `
                    <div class="stats">
                        <div class="stat-box">
                            <div class="stat-value">${data.totalPapers}</div>
                            <div class="stat-label">总论文数</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${data.totalJournals}</div>
                            <div class="stat-label">期刊数</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${data.topTierPapers}</div>
                            <div class="stat-label">顶刊论文</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-value">${data.papersLastYear}</div>
                            <div class="stat-label">去年论文</div>
                        </div>
                    </div>
                `;
            } catch (error) {
                statsDiv.innerHTML = `<p style="color: red;">加载失败：${error.message}</p>`;
            }
        }

        // Export functions
        async function exportCSV() {
            window.open(`${API_BASE}/api/export/csv`, '_blank');
        }

        async function exportJSON() {
            window.open(`${API_BASE}/api/export/json`, '_blank');
        }

        // Check status on load
        window.addEventListener('DOMContentLoaded', checkStatus);

        // Allow Enter key to search
        document.getElementById('keyword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchPapers();
            }
        });
    </script>
</body>
</html>
