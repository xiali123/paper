# PaperCrawler API Gateway Configuration
# Nginx as reverse proxy, load balancer, and rate limiter

# Upstream backend services (gRPC over HTTP/2)
upstream search_service {
    least_conn;
    server search-service:50051 max_fails=3 fail_timeout=30s;
    server search-service-2:50051 max_fails=3 fail_timeout=30s;
    keepalive 32;
    keepalive_requests 100;
    keepalive_timeout 60s;
}

upstream sync_service {
    least_conn;
    server sync-service:50052 max_fails=3 fail_timeout=30s;
    server sync-service-2:50052 max_fails=3 fail_timeout=30s;
    keepalive 16;
}

upstream analytics_service {
    least_conn;
    server analytics-service:50053 max_fails=3 fail_timeout=30s;
    keepalive 8;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=search_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=sync_limit:10m rate=5r/s;

# Connection limiting
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

# Cache configuration
proxy_cache_path /var/cache/nginx/api_cache
    levels=1:2
    keys_zone=api_cache:10m
    max_size=100m
    inactive=60m
    use_temp_path=off;

# Logging
log_format api_log '$remote_addr - $remote_user [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   '"$http_referer" "$http_user_agent" '
                   'rt=$request_time uct="$upstream_connect_time" '
                   'uht="$upstream_header_time" urt="$upstream_response_time"';

access_log /var/log/nginx/api_access.log api_log;
error_log /var/log/nginx/api_error.log warn;

# HTTP Server (redirect to HTTPS)
server {
    listen 80;
    server_name api.papercrawler.com localhost;

    location / {
        return 301 https://$host$request_uri;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name api.papercrawler.com localhost;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Connection limits
    limit_conn conn_limit 10;

    # Client body size limit
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Search API endpoints
    location /api/v1/search {
        limit_req zone=search_limit burst=20 nodelay;

        proxy_pass http://search_service;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache for GET requests
        proxy_cache api_cache;
        proxy_cache_valid 200 302 5m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;

        # Cache key
        proxy_cache_key "$scheme$request_method$host$request_uri$is_args$args";

        # Bypass cache for specific conditions
        proxy_cache_bypass $http_cache_control $cookie_nocache;
        proxy_no_cache $http_pragma $http_authorization;

        # CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    # Paper details endpoint
    location /api/v1/papers/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://search_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache paper details
        proxy_cache api_cache;
        proxy_cache_valid 200 302 30m;
        proxy_cache_valid 404 5m;

        add_header Access-Control-Allow-Origin "*" always;
    }

    # Sync endpoint (no caching)
    location /api/v1/sync {
        limit_req zone=sync_limit burst=10 nodelay;

        proxy_pass http://sync_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Disable buffering for streaming
        proxy_buffering off;

        add_header Access-Control-Allow-Origin "*" always;
    }

    # Statistics endpoint
    location /api/v1/stats {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://analytics_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Cache statistics
        proxy_cache api_cache;
        proxy_cache_valid 200 1h;

        add_header Access-Control-Allow-Origin "*" always;
    }

    # Export endpoint
    location /api/v1/export {
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass http://analytics_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # No caching for exports

        add_header Access-Control-Allow-Origin "*" always;
        add_header Content-Disposition "attachment";
    }

    # WebSocket endpoint for real-time updates
    location /ws {
        proxy_pass http://sync_service;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket timeout
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;

        # Disable buffering
        proxy_buffering off;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Metrics endpoint for Prometheus
    location /metrics {
        stub_status on;
        access_log off;
        allow 172.20.0.0/16;  # monitoring network
        deny all;
    }

    # Error pages
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
