# Prometheus configuration for PaperCrawler
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: 'papercrawler'

scrape_configs:
  # Backend API metrics
  - job_name: 'papercrawler-backend'
    static_configs:
      - targets: ['backend:8080']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # Frontend metrics (if available)
  - job_name: 'papercrawler-frontend'
    static_configs:
      - targets: ['frontend:80']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # MySQL exporter (optional)
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql:3306']
    scrape_interval: 30s

  # Redis exporter (optional)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
