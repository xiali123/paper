<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .test-container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .hero {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 20px;
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 48px;
            color: #1f2937;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 20px;
            color: #6b7280;
        }
        .features-section {
            margin: 60px 0;
            padding: 50px 30px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            border: 3px solid #667eea;
        }
        .features-title {
            text-align: center;
            margin-bottom: 40px;
        }
        .features-title h2 {
            font-size: 32px;
            color: #667eea;
            margin-bottom: 10px;
        }
        .features-title p {
            font-size: 16px;
            color: #374151;
            margin: 0;
        }
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
        }
        .feature-card {
            background: #f9fafb;
            padding: 36px 24px;
            border-radius: 20px;
            text-align: center;
            border: 2px solid #e5e7eb;
        }
        .feature-card h3 {
            color: #1f2937;
            margin: 20px 0 12px;
            font-size: 20px;
        }
        .feature-card p {
            color: #6b7280;
            margin: 0;
            font-size: 15px;
        }
        .feature-icon {
            font-size: 56px;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <!-- Hero Section -->
        <div class="hero">
            <h1>学术论文检索平台</h1>
            <p>快速搜索、分析和导出学术论文</p>
        </div>

        <!-- Features Section -->
        <div class="features-section">
            <div class="features-title">
                <h2>核心功能</h2>
                <p>强大的论文检索与分析工具</p>
            </div>
            <div class="features">
                <div class="feature-card">
                    <div class="feature-icon">🔍</div>
                    <h3>论文搜索</h3>
                    <p>从DBLP数据库快速检索学术论文</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">📊</div>
                    <h3>统计分析</h3>
                    <p>期刊分布、年度趋势分析</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">📥</div>
                    <h3>数据导出</h3>
                    <p>支持CSV、JSON、BibTeX格式</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">⚡</div>
                    <h3>高性能</h3>
                    <p>C++实现，性能提升10-100倍</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
