<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>搜索功能测试</title>
</head>
<body>
    <h1>搜索功能诊断</h1>
    <ol>
        <li>打开浏览器控制台 (F12)</li>
        <li>访问 <a href="http://localhost:5173/search" target="_blank">http://localhost:5173/search</a></li>
        <li>检查是否有错误信息</li>
        <li>尝试在搜索框输入内容</li>
        <li>点击搜索按钮</li>
    </ol>
    <h2>常见问题：</h2>
    <ul>
        <li>如果页面空白 - 检查控制台是否有组件加载错误</li>
        <li>如果搜索无反应 - 检查网络请求是否成功 (Network标签)</li>
        <li>如果结果显示异常 - 检查API响应格式</li>
    </ul>
</body>
</html>
